{% extends "base.html" %}
{% block content %}
<h2>Runs</h2>
<table>
  <tr><th>id</th><th>runbook</th><th>status</th><th>created</th></tr>
  {% for r in runs %}
  <tr><td><a href="/runs/{{ r.id }}">{{ r.id[:8] }}</a></td><td>{{ r.runbook }}</td>
      <td>{{ r.status }}</td><td>{{ r.created_at }}</td></tr>
  {% endfor %}
</table>
{% endblock %}
